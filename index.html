<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hukum Ohm &amp; Rangkaian Seri-Paralel | Modul Interaktif</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="Media Pembelajaran Hukum Ohm" data-header="beranda" data-width="sempit">
  <header id="hdr"></header>

  <main class="p-4 sm:p-6">
    <section class="hero-section p-4 sm:p-6 md:p-8">
      <div class="grid grid-cols-1 md:grid-cols-[38%_62%] gap-6 md:gap-8 items-center">
        <!-- Kolom Kiri: Ilustrasi Hero -->
        <div class="flex items-center justify-center">
          <img src="assets/img/hero.png" alt="Ilustrasi bohlam, multimeter, dan resistor" class="w-full max-w-[240px] md:max-w-full h-auto object-contain drop-shadow-sm">
        </div>

        <!-- Kolom Kanan: Teks, Tombol, dan Menu -->
        <div class="flex flex-col justify-center space-y-5">
          <!-- Judul & Subjudul -->
          <div>
            <h2 class="font-extrabold text-[clamp(1.5rem,3vw,2rem)] leading-tight tracking-tight text-[var(--ink)]">
              Hukum Ohm &amp;<br class="hidden md:block"> Rangkaian Seri-Paralel
            </h2>
            <p class="text-xs sm:text-sm text-gray-600 mt-2 max-w-[26ch] leading-relaxed">
              Mari belajar dan pahami konsep kelistrikan secara interaktif!
            </p>
          </div>

          <!-- Tombol Mulai Belajar -->
          <div>
            <a href="materi.html" class="btn btn-primary btn-mulai w-full md:w-3/4">
              <span class="flex items-center gap-3">
                <span class="w-7 h-7 rounded-full bg-white text-[var(--blue)] flex items-center justify-center shadow-sm">
                  <svg class="ic w-4 h-4 translate-x-0.5" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg>
                </span>
                <span class="font-bold text-sm sm:text-base">Mulai Belajar</span>
              </span>
              <svg class="ic w-5 h-5 text-white/90" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
            </a>
          </div>

          <!-- Menu 4 Kotak -->
          <nav aria-label="Menu utama" class="grid grid-cols-4 gap-2 sm:gap-3 pt-2">
            <a href="materi.html" class="menu-card bg-[var(--blue)]">
              <svg class="ic w-7 h-7" aria-hidden="true" focusable="false"><use href="#i-book-open"></use></svg>
              <span class="font-bold text-[11px] sm:text-xs tracking-wide">Materi</span>
            </a>
            <a href="simulasi-ohm.html" class="menu-card bg-[var(--green)]">
              <svg class="ic w-7 h-7" aria-hidden="true" focusable="false"><use href="#i-activity"></use></svg>
              <span class="font-bold text-[11px] sm:text-xs tracking-wide">Simulasi</span>
            </a>
            <a href="kuis.html" class="menu-card bg-[var(--orange)]">
              <svg class="ic w-7 h-7" aria-hidden="true" focusable="false"><use href="#i-clipboard-check"></use></svg>
              <span class="font-bold text-[11px] sm:text-xs tracking-wide">Latihan</span>
            </a>
            <a href="simulasi-sp.html" class="menu-card bg-[var(--indigo)]">
              <svg class="ic w-7 h-7" aria-hidden="true" focusable="false"><use href="#i-bar-chart-3"></use></svg>
              <span class="font-bold text-[11px] sm:text-xs tracking-wide">Evaluasi</span>
            </a>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <script defer src="js/icons.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/beranda.js"></script>
</body>
</html>
