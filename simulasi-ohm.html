<!DOCTYPE html>
<html lang="id" data-kontras="normal" data-huruf="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulasi Hukum Ohm | Modul Interaktif</title>
  <script src="js/aksesibilitas-awal.js"></script>
  <link rel="icon" href="assets/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="Simulasi Hukum Ohm" data-back="materi.html" data-header="bantuan" data-width="sempit" data-help="Geser slider Tegangan (V) atau Hambatan (R) untuk melihat perubahan arus (I) secara langsung pada rangkaian listrik. Tekan tombol Play untuk melihat pergerakan aliran arus listrik. Tekan tombol Cek untuk melihat uraian langkah perhitungan matematis I = V / R.">
  <a class="skip-link" href="#konten">Lewati ke konten utama</a>
  <header id="hdr"></header>

  <main id="konten" tabindex="-1" class="p-4 sm:p-5">
    <div class="ohm-layout grid grid-cols-1 md:grid-cols-[49%_51%] gap-4 sm:gap-5 items-stretch">
      <!-- Kolom Kiri: Rangkaian SVG & Pita Kontrol Play/Reset -->
      <section class="panel flex flex-col justify-between p-4 sm:p-5" aria-label="Visualisasi Rangkaian">
        <!-- SVG Rangkaian Hukum Ohm -->
        <div class="flex-1 flex items-center justify-center min-h-[250px]">
          <svg viewBox="0 0 440 300" class="w-full h-auto max-w-[420px] mx-auto select-none" role="img" aria-label="Diagram Rangkaian Tertutup Baterai, Resistor, dan Amperemeter">
            <title>Diagram Rangkaian Hukum Ohm Interaktif</title>

            <!-- Loop Jalur Kabel Arus Tertutup untuk Animasi Titik Elektron -->
            <path id="loop" d="M 68 85 L 68 60 Q 68 50 78 50 L 140 50 L 290 50 Q 308 50 308 68 L 308 190 Q 308 208 290 208 L 78 208 Q 68 208 68 198 L 68 155" fill="none" stroke="transparent" />

            <!-- Kabel Merah: Kutub Positif Baterai ke Resistor -->
            <path d="M 68 85 L 68 60 Q 68 50 78 50 L 140 50" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Kaki Resistor Kiri & Kanan (Abu-abu Logam) -->
            <line x1="135" y1="50" x2="152" y2="50" stroke="var(--track)" stroke-width="5" stroke-linecap="round" />
            <line x1="268" y1="50" x2="285" y2="50" stroke="var(--track)" stroke-width="5" stroke-linecap="round" />

            <!-- Kabel Navy Gelap: Resistor ke Ammeter lalu ke Kutub Negatif Baterai -->
            <path d="M 280 50 L 290 50 Q 308 50 308 68 L 308 100 M 308 160 L 308 190 Q 308 208 290 208 L 78 208 Q 68 208 68 198 L 68 155" fill="none" stroke="var(--navy)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Baterai Vertikal (Atas Merah dengan tanda minus/plus, Badan Hitam) -->
            <g id="battery">
              <!-- Kepala Terminal Atas -->
              <rect x="62" y="80" width="12" height="5" rx="1.5" fill="var(--track)" />
              <!-- Bagian Atas Merah (Kutub) -->
              <rect x="50" y="85" width="36" height="28" rx="3" fill="var(--orange)" />
              <!-- Tanda Kutub Putih -->
              <line x1="59" y1="99" x2="77" y2="99" stroke="var(--white)" stroke-width="3" stroke-linecap="round" />
              <!-- Bagian Bawah Baterai (Badan Gelap) -->
              <rect x="50" y="113" width="36" height="42" rx="3" fill="var(--ink)" />
              <!-- Label Nilai Baterai (V) di samping baterai -->
              <text id="bat-label" x="98" y="124" font-size="16" font-weight="800" fill="var(--ink)">12 V</text>
            </g>

            <!-- Resistor Horizontal Bergelang Warna -->
            <g id="resistor">
              <!-- Badan Utama Resistor (Warna Krem) -->
              <rect x="150" y="38" width="120" height="24" rx="10" fill="var(--res-body)" stroke="var(--res-border)" stroke-width="1.5" />
              <rect x="158" y="41" width="104" height="18" rx="6" fill="var(--res-core)" />

              <!-- Gelang Kode Warna Resistor (4 Gelang) -->
              <g id="res-bands">
                <rect id="g0" x="168" y="38" width="8" height="24" rx="1" fill="var(--blue)" />
                <rect id="g1" x="186" y="38" width="8" height="24" rx="1" fill="var(--ink)" />
                <rect id="g2" x="204" y="38" width="8" height="24" rx="1" fill="var(--gold)" />
                <rect id="g3" x="242" y="38" width="8" height="24" rx="1" fill="var(--gold)" />
              </g>

              <!-- Label R di atas resistor -->
              <text x="210" y="26" font-size="16" font-weight="800" font-style="italic" fill="var(--ink)" text-anchor="middle">R</text>
            </g>

            <!-- Amperemeter di sisi kanan -->
            <g id="ammeter">
              <!-- Lingkaran Amperemeter A -->
              <circle cx="308" cy="130" r="24" fill="var(--white)" stroke="var(--navy)" stroke-width="3.5" />
              <text x="308" y="138" font-size="20" font-weight="800" fill="var(--ink)" text-anchor="middle">A</text>

              <!-- Kotak Hasil Pembacaan Arus Amperemeter -->
              <g id="amp-container" transform="translate(266, 168)">
                <rect width="84" height="30" rx="8" fill="var(--box-formula)" stroke="var(--line)" stroke-width="1.5" />
                <text id="amp-box" x="42" y="21" font-size="15" font-weight="800" fill="var(--ink)" text-anchor="middle">2.00 A</text>
              </g>
            </g>

            <!-- Titik & Arah Arus di Jalur Bawah -->
            <g id="current-indicator">
              <circle cx="200" cy="208" r="5" fill="var(--blue)" />
              <text x="200" y="196" font-size="16" font-weight="800" font-style="italic" fill="var(--ink)" text-anchor="middle">I</text>
            </g>

            <!-- Titik-Titik Animasi Aliran Arus Elektron -->
            <g id="dots"></g>
          </svg>
        </div>

        <!-- Pita Kontrol di Bawah SVG: Tombol Putar (Play/Pause) & Reset -->
        <div class="pt-4 mt-2 border-t border-[var(--line)] flex items-center gap-3">
          <button type="button" id="play" class="btn-play-round" aria-label="Mulai animasi aliran arus" aria-pressed="false">
            <svg class="ic w-6 h-6" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg>
          </button>
          <button type="button" id="reset" class="btn btn-outline">
            Reset
          </button>
        </div>
      </section>

      <!-- Kolom Kanan: Pengaturan Slider & Hasil Perhitungan -->
      <section class="panel flex flex-col justify-between p-4 sm:p-5" aria-label="Panel Kontrol dan Hasil">
        <div class="space-y-5">
          <!-- Judul Pengaturan -->
          <div>
            <h2 class="text-lg font-bold text-[var(--ink)] mb-3">Pengaturan</h2>

            <!-- Kontrol Slider Tegangan (V) -->
            <div class="space-y-1.5 mb-4">
              <label for="v" class="block font-semibold text-sm text-[var(--ink)]">Tegangan (V)</label>
              <div class="flex items-center gap-3">
                <input id="v" type="range" min="1" max="24" step="1" value="12" class="flex-1" aria-label="Slider Tegangan">
                <div class="input-angka-wrap">
                  <input id="vn" type="text" inputmode="decimal" value="12" aria-label="Nilai Tegangan dalam Volt">
                  <span class="satuan">V</span>
                </div>
                <output id="vOut" class="sr-only">12 V</output>
              </div>
            </div>

            <!-- Kontrol Slider Hambatan (R) -->
            <div class="space-y-1.5">
              <label for="r" class="block font-semibold text-sm text-[var(--ink)]">Hambatan (&Omega;)</label>
              <div class="flex items-center gap-3">
                <input id="r" type="range" min="1" max="100" step="1" value="6" class="flex-1" aria-label="Slider Hambatan">
                <div class="input-angka-wrap">
                  <input id="rn" type="text" inputmode="decimal" value="6" aria-label="Nilai Hambatan dalam Ohm">
                  <span class="satuan">&Omega;</span>
                </div>
                <output id="rOut" class="sr-only">6 &Omega;</output>
              </div>
            </div>
          </div>

          <!-- Bagian Hasil Perhitungan -->
          <div>
            <h2 class="text-lg font-bold text-[var(--ink)] mb-3">Hasil</h2>
            <div id="hasil-live" class="grid grid-cols-3 gap-2 sm:gap-3" aria-live="off">
              <div class="box-hasil">
                <small>Tegangan</small>
                <b id="hV">12 V</b>
              </div>
              <div class="box-hasil">
                <small>Arus</small>
                <b id="hI">2.00 A</b>
              </div>
              <div class="box-hasil">
                <small>Hambatan</small>
                <b id="hR">6 &Omega;</b>
              </div>
            </div>
            <p id="hasil-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>

        <!-- Tombol Cek di Kanan Bawah Panel -->
        <div class="pt-4 mt-4 border-t border-[var(--line)] flex justify-end">
          <button type="button" id="cek" class="btn btn-primary px-8">
            Cek
          </button>
        </div>
      </section>
    </div>
  </main>

  <script defer src="js/icons.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/ohm.js"></script>
</body>
</html>
