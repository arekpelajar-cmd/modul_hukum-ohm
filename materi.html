<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Materi Hukum Ohm | Modul Interaktif</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX CDN versi tetap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="Hukum Ohm" data-back="index.html" data-header="materi" data-width="sempit">
  <header id="hdr"></header>

  <main class="p-4 sm:p-6">
    <div class="grid grid-cols-1 md:grid-cols-[22%_78%] gap-4 sm:gap-6 items-start">
      <!-- Sidebar Subbab (Navigasi Tab) -->
      <nav aria-label="Subbab Materi" class="materi-sidebar">
        <button type="button" id="materi-menu-toggle" class="materi-menu-toggle" aria-expanded="false" aria-controls="tablist-materi">
          <span class="menu-toggle-icon" aria-hidden="true"></span>
          <span>Pilih subbab materi</span>
        </button>
        <div role="tablist" aria-orientation="vertical" id="tablist-materi" class="flex flex-row md:flex-col gap-1.5 min-w-max md:min-w-0">
          <!-- Tombol tab diinjeksi via JS -->
        </div>
      </nav>

      <!-- Kartu Konten Utama -->
      <section class="panel space-y-4">
        <!-- Region Live untuk Aksesibilitas Pembaca Layar -->
        <div id="materi-announcer" class="sr-only" aria-live="polite"></div>

        <!-- Kontainer Isi Konten Dinamis -->
        <div id="konten" class="space-y-4 min-h-[340px]">
          <!-- Konten dirender oleh js/materi.js -->
        </div>

        <!-- Footer Tombol Navigasi Lanjut -->
        <div class="pt-4 border-t border-gray-100 flex justify-end">
          <button type="button" id="lanjut" class="btn btn-primary">
            <span>Lanjut</span>
            <svg class="ic w-4 h-4" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
          </button>
        </div>
      </section>
    </div>
  </main>

  <script defer src="js/icons.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="data/materi.js"></script>
  <script defer src="js/materi.js"></script>
</body>
</html>
