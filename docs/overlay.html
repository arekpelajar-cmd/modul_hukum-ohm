<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alat Bantu Overlay Referensi Storyboard</title>
  <style>
    :root {
      --navy: #15497E;
      --blue: #0062DD;
      --bg: #f3f7fc;
      --ink: #0f2440;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #334155;
      color: var(--ink);
    }
    header.toolbar {
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-group label {
      color: #94a3b8;
      font-weight: 500;
    }
    .ctrl-group input[type="range"] {
      width: 90px;
      cursor: pointer;
    }
    .ctrl-group input[type="number"] {
      width: 64px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }
    button.tool-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }
    button.tool-btn:hover {
      filter: brightness(1.1);
    }
    button.tool-btn.secondary {
      background: #475569;
    }
    .viewport-container {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      overflow: auto;
    }
    .stage {
      position: relative;
      background: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    iframe#app-frame {
      border: none;
      display: block;
      width: 912px;
      height: 640px;
    }
    img#overlay-img {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 880px;
      height: auto;
      pointer-events: none;
      opacity: 0.4;
      z-index: 50;
      transition: opacity 0.1s ease;
    }
    #msg-copied {
      color: #4ade80;
      font-weight: bold;
      display: none;
    }
    .notice {
      color: #cbd5e1;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header class="toolbar">
    <div class="ctrl-group">
      <label for="range-op">Opacity:</label>
      <input type="range" id="range-op" min="0" max="100" value="40">
      <span id="val-op">40%</span>
    </div>

    <div class="ctrl-group">
      <label for="range-w">Lebar Ref (px):</label>
      <input type="range" id="range-w" min="400" max="1100" value="880">
      <span id="val-w">880px</span>
    </div>

    <div class="ctrl-group">
      <label for="num-x">X:</label>
      <input type="number" id="num-x" value="16">
    </div>

    <div class="ctrl-group">
      <label for="num-y">Y:</label>
      <input type="number" id="num-y" value="16">
    </div>

    <div class="ctrl-group">
      <label for="num-frame-w">Iframe (px):</label>
      <input type="number" id="num-frame-w" value="912">
    </div>

    <button type="button" id="btn-toggle" class="tool-btn secondary">Sembunyikan Overlay</button>
    <button type="button" id="btn-copy" class="tool-btn">Salin Nilai</button>
    <span id="msg-copied">Tersalin!</span>
    <span class="notice">[Alat Pengembang — Tidak untuk Produksi]</span>
  </header>

  <div class="viewport-container">
    <div class="stage" id="stage">
      <iframe id="app-frame" src="../index.html"></iframe>
      <img id="overlay-img" src="ref/layar-1.png" alt="Overlay Storyboard Reference">
    </div>
  </div>

  <script>
    // Inisialisasi dari URL Query Params
    const urlParams = new URLSearchParams(window.location.search);
    const targetPage = urlParams.get('page') || '../index.html';
    const targetRef = urlParams.get('ref') || 'ref/layar-1.png';

    const frame = document.getElementById('app-frame');
    const overlay = document.getElementById('overlay-img');
    const rangeOp = document.getElementById('range-op');
    const valOp = document.getElementById('val-op');
    const rangeW = document.getElementById('range-w');
    const valW = document.getElementById('val-w');
    const numX = document.getElementById('num-x');
    const numY = document.getElementById('num-y');
    const numFrameW = document.getElementById('num-frame-w');
    const btnToggle = document.getElementById('btn-toggle');
    const btnCopy = document.getElementById('btn-copy');
    const msgCopied = document.getElementById('msg-copied');

    frame.src = targetPage;
    overlay.src = targetRef;

    let isVisible = true;

    function update() {
      const op = rangeOp.value;
      const w = rangeW.value;
      const x = numX.value;
      const y = numY.value;
      const fw = numFrameW.value;

      valOp.textContent = op + '%';
      valW.textContent = w + 'px';

      overlay.style.opacity = isVisible ? (op / 100) : '0';
      overlay.style.width = w + 'px';
      overlay.style.left = x + 'px';
      overlay.style.top = y + 'px';

      frame.style.width = fw + 'px';
    }

    rangeOp.addEventListener('input', update);
    rangeW.addEventListener('input', update);
    numX.addEventListener('input', update);
    numY.addEventListener('input', update);
    numFrameW.addEventListener('input', update);

    btnToggle.addEventListener('click', () => {
      isVisible = !isVisible;
      btnToggle.textContent = isVisible ? 'Sembunyikan Overlay' : 'Tampilkan Overlay';
      update();
    });

    btnCopy.addEventListener('click', () => {
      const info = `Overlay Config:\nPage: ${targetPage}\nRef: ${targetRef}\nOpacity: ${rangeOp.value}%\nWidth: ${rangeW.value}px\nX: ${numX.value}px\nY: ${numY.value}px\nIframe Width: ${numFrameW.value}px`;
      navigator.clipboard.writeText(info).then(() => {
        msgCopied.style.display = 'inline';
        setTimeout(() => { msgCopied.style.display = 'none'; }, 2000);
      });
    });

    update();
  </script>
</body>
</html>
